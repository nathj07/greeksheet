name: Release

on:
  push:
    tags:
      - 'v*'

jobs:

  # ── macOS (Apple Silicon) ──────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Credentials are stored as repository secrets and injected here so they
      # never appear in source. The ldflags set the package-level vars declared
      # in internal/auth/auth.go. For desktop OAuth2 apps the secret is not truly
      # secret — see https://developers.google.com/identity/protocols/oauth2/native-app
      - name: Build macOS (Apple Silicon)
        env:
          LDFLAGS: >-
            -X github.com/nathj07/greeksheet/internal/auth.embeddedClientID=${{ secrets.GOOGLE_CLIENT_ID }}
            -X github.com/nathj07/greeksheet/internal/auth.embeddedClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: GOARCH=arm64 go build -ldflags "$LDFLAGS" -o greeksheet-darwin-arm64 ./cmd/greeksheet

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: greeksheet-darwin-arm64

  # ── Windows (amd64) ────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # goversioninfo generates a resource.syso file containing Windows PE
      # version metadata (FileDescription, ProductName, etc.). The Go toolchain
      # links any *.syso it finds in the package directory automatically, so no
      # extra build flags are needed. Embedding version info reduces the
      # likelihood of AV tools flagging the binary as suspicious.
      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
        shell: pwsh

      - name: Generate Windows version resource
        run: goversioninfo -o ./cmd/greeksheet/resource.syso ./cmd/greeksheet/versioninfo.json
        shell: pwsh

      - name: Build Windows
        env:
          GOARCH: amd64
          LDFLAGS: >-
            -X github.com/nathj07/greeksheet/internal/auth.embeddedClientID=${{ secrets.GOOGLE_CLIENT_ID }}
            -X github.com/nathj07/greeksheet/internal/auth.embeddedClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: go build -ldflags "$env:LDFLAGS" -o greeksheet-windows-amd64.exe ./cmd/greeksheet
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: greeksheet-windows-amd64.exe

  # ── Create GitHub Release ──────────────────────────────────────────────────
  # Only runs after both platform builds succeed.
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos-artifact/greeksheet-darwin-arm64
            dist/windows-artifact/greeksheet-windows-amd64.exe
          generate_release_notes: true
