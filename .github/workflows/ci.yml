# Runs build, vet, and tests on every push to main and every PR targeting main.
#
# Two jobs run in parallel:
#   test     — ubuntu-latest for the CLI and all internal packages
#   test-gui — macos-latest for gui/greeksheetui, which depends on Fyne and
#              requires native graphics headers (OpenGL/Metal) not available on
#              ubuntu-latest
#
# Both job names are registered as required status checks under
# Settings → Branches → Branch protection rules.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/... ./internal/...

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Test
        run: go test ./cmd/... ./internal/...

  test-gui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./gui/...

      - name: Vet
        run: go vet ./gui/...

      - name: Test
        run: go test ./gui/...
