name: UI Release

on:
  push:
    tags:
      - 'ui/v*'

jobs:

  # ── macOS (Apple Silicon) ──────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      # Strip the "ui/v" prefix so appVersion receives a plain semver string,
      # e.g. ui/v1.2.3 → 1.2.3.
      - name: Extract version
        id: ver
        run: echo "val=${GITHUB_REF_NAME#ui/v}" >> "$GITHUB_OUTPUT"

      # Build the binary first using go build -ldflags, which handles multiple
      # -X flags correctly. This avoids passing ldflags through GOFLAGS (which
      # fyne's internal strings.Fields parser splits incorrectly on spaces).
      # The >- YAML scalar folds the two lines into one space-separated string,
      # identical to the pattern used in release.yml for the CLI binary.
      - name: Build macOS binary
        env:
          LDFLAGS: >-
            -X github.com/nathj07/greeksheet/internal/auth.embeddedClientID=${{ secrets.GOOGLE_CLIENT_ID }}
            -X github.com/nathj07/greeksheet/internal/auth.embeddedClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: go build -ldflags "$LDFLAGS" -o greeksheetui-bin ./gui/greeksheetui

      # fyne package --executable takes the pre-built binary and wraps it into
      # a .app bundle (icon, Info.plist) without running go build again, so
      # GOFLAGS is never consulted. The .app lands in the repo root (the CWD at
      # invocation time, before fyne internally chdir-s into --src).
      - name: Package macOS app
        run: |
          fyne package \
            --os darwin \
            --src ./gui/greeksheetui \
            --executable ./greeksheetui-bin \
            --app-id io.github.nathj07.greeksheetui \
            --app-version "${{ steps.ver.outputs.val }}" \
            --app-build "${{ github.run_number }}"
          # Strip the com.apple.quarantine extended attribute that macOS sets on
          # files created by the build tools. Without this, Gatekeeper treats the
          # downloaded (unnotarized) bundle as "damaged" on macOS 13+ and refuses
          # to open it entirely, rather than showing the softer "unidentified
          # developer" prompt with an "Open Anyway" option.
          xattr -cr "Greek Sheet UI.app"
          zip -r "greeksheetui-darwin-arm64.zip" "Greek Sheet UI.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: greeksheetui-darwin-arm64.zip

  # ── Windows (amd64) ────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fyne requires CGO on Windows. MinGW-w64 is pre-installed on the
      # windows-latest runner at this path — adding it to PATH is all that's needed.
      - name: Add MinGW to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Extract version
        id: ver
        run: |
          $val = "${{ github.ref_name }}" -replace '^ui/v', ''
          echo "val=$val" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # Pre-build into srcDir so that fyne package --executable finds the binary
      # in the same directory it chdir-s into. fyne package on Windows always
      # rebuilds (to embed icon/.syso) and renames the output relative to srcDir,
      # so placing the exe there avoids cross-directory rename failures.
      - name: Build Windows binary
        env:
          GOARCH: amd64
          LDFLAGS: >-
            -X github.com/nathj07/greeksheet/internal/auth.embeddedClientID=${{ secrets.GOOGLE_CLIENT_ID }}
            -X github.com/nathj07/greeksheet/internal/auth.embeddedClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: go build -ldflags "$env:LDFLAGS" -o ./gui/greeksheetui/greeksheetui-tmp.exe ./gui/greeksheetui
        shell: pwsh

      - name: Package Windows app
        run: |
          # fyne package always rebuilds on Windows (to embed icon + manifest as a
          # .syso resource). It reads -ldflags= tokens from GOFLAGS and merges them
          # with its own flags (including -H=windowsgui), so credentials survive the
          # rebuild and no console window appears on launch.
          #
          # GOFLAGS is set inline here rather than via the env: block because the
          # two -X flags each contain a space, and the YAML >- scalar would split
          # them into separate tokens that fyne's GOFLAGS parser cannot reassemble.
          $cid = "${{ secrets.GOOGLE_CLIENT_ID }}"
          $csec = "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          $env:GOFLAGS = "-ldflags=-X github.com/nathj07/greeksheet/internal/auth.embeddedClientID=$cid -X github.com/nathj07/greeksheet/internal/auth.embeddedClientSecret=$csec"
          fyne package `
            --os windows `
            --src ./gui/greeksheetui `
            --executable ./gui/greeksheetui/greeksheetui-tmp.exe `
            --app-id io.github.nathj07.greeksheetui `
            --app-version "${{ steps.ver.outputs.val }}" `
            --app-build "${{ github.run_number }}"
          # fyne package renames the output to "Greek Sheet UI.exe" inside srcDir.
          Move-Item ".\gui\greeksheetui\Greek Sheet UI.exe" "greeksheetui-windows-amd64.exe"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: greeksheetui-windows-amd64.exe

  # ── Create GitHub Release ──────────────────────────────────────────────────
  # Only runs after both platform builds succeed.
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos-artifact/greeksheetui-darwin-arm64.zip
            dist/windows-artifact/greeksheetui-windows-amd64.exe
          generate_release_notes: true
