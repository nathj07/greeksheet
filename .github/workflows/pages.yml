# Deploys the docs/ directory to GitHub Pages whenever it changes on main.
#
# One-time setup required in the repo:
#   Settings → Pages → Source → GitHub Actions
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
  # Allow a manual trigger from the Actions tab.
  workflow_dispatch:

# Allow only one concurrent deployment; cancel any in-progress run so the
# live site always reflects the latest push.
concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
